<ion-content>
  <div class="container">
    
    <div class="brand-section">
      <h1>PesoHarvest</h1>
      <p>Grow Your Future</p>
    </div>

    <div class="button-group">
      <ion-button class="btn-start" expand="block" routerLink="/farming">
        Start Farming
        <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
      </ion-button>

      <ion-button class="btn-explore" expand="block" routerLink="/opportunities">
        Explore Opportunities
        <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-tab-bar slot="bottom" style="--background: #1a3015; color: white;">
    <ion-tab-button tab="wallet">
      <ion-icon name="wallet"></ion-icon>
      <ion-label>Wallet</ion-label>
    </ion-tab-button>
    </ion-tab-bar>
</ion-footer>
