<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-header class="ion-no-border">
      <ion-toolbar class="harvest-header-global">
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content class="parchment-background">
      <ion-list lines="none">
        <ion-menu-toggle auto-hide="false">
          
          <ion-item button routerLink="/wallet" routerDirection="root">
            <ion-icon slot="start" name="wallet"></ion-icon>
            <ion-label>My Wallet</ion-label>
          </ion-item>

          <ion-item button routerLink="/products" routerDirection="root">
            <ion-icon slot="start" name="person"></ion-icon>
            <ion-label>Profile</ion-label>
          </ion-item>

          <ion-item button routerLink="/membership" routerDirection="root">
            <ion-icon slot="start" name="cog"></ion-icon>
            <ion-label>Settings</ion-label>
          </ion-item>

           <ion-item button routerLink="/membership" routerDirection="root">
            <ion-icon slot="start" name="exit"></ion-icon>
            <ion-label>Log out</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-app>
